<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="darkLogoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="darkLogoMaroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A72638"/>
      <stop offset="50%" stop-color="#6E1423"/>
      <stop offset="100%" stop-color="#3E0812"/>
    </linearGradient>
  </defs>

  <!-- Left Emblem (Scales 90x90 at (15, 15)) -->
  <g transform="translate(15, 15)">
    <!-- Base Medallion -->
    <circle cx="45" cy="45" r="44" fill="url(#darkLogoMaroon)"/>
    <circle cx="45" cy="45" r="41" fill="none" stroke="url(#darkLogoGold)" stroke-width="1.2" opacity="0.7"/>
    <circle cx="45" cy="45" r="38" fill="none" stroke="url(#darkLogoGold)" stroke-width="2"/>

    <!-- Mini Crown -->
    <g transform="translate(0, -3)">
      <path d="M 33 27 Q 45 29 57 27 L 58 30 Q 45 32 32 30 Z" fill="url(#darkLogoGold)"/>
      <path d="M 43 27 L 45 18 L 47 27 Z" fill="url(#darkLogoGold)"/>
      <circle cx="45" cy="17" r="1.8" fill="url(#darkLogoGold)"/>
      <path d="M 37 27 L 38 21 L 41 27 Z" fill="url(#darkLogoGold)"/>
      <circle cx="38" cy="20.5" r="1.4" fill="url(#darkLogoGold)"/>
      <path d="M 53 27 L 52 21 L 49 27 Z" fill="url(#darkLogoGold)"/>
      <circle cx="52" cy="20.5" r="1.4" fill="url(#darkLogoGold)"/>
    </g>

    <!-- Monogram R -->
    <path d="M 36 34 L 36 62" fill="none" stroke="url(#darkLogoGold)" stroke-width="4.5" stroke-linecap="square"/>
    <path d="M 33 34 L 40 34" fill="none" stroke="url(#darkLogoGold)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 33 62 L 41 62" fill="none" stroke="url(#darkLogoGold)" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 36 34 L 46 34 C 52 34 56 37 56 42 C 56 47 52 50 46 50 L 36 50"
      fill="none" stroke="url(#darkLogoGold)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 44 49.5 Q 48 53 57 62"
      fill="none" stroke="url(#darkLogoGold)" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="57" cy="62" r="1.6" fill="url(#darkLogoGold)"/>

    <!-- E flourish -->
    <path d="M 54 44 Q 61 44 61 51 Q 61 60 51 60 L 41 60"
      fill="none" stroke="url(#darkLogoGold)" stroke-width="2.2" stroke-linecap="round" opacity="0.95"/>
    <path d="M 49 52 L 58 52"
      fill="none" stroke="url(#darkLogoGold)" stroke-width="1.8" stroke-linecap="round" opacity="0.95"/>

    <!-- Bottom Laurel Arc -->
    <path d="M 23 58 C 23 68 31 74 45 74 C 59 74 67 68 67 58" fill="none" stroke="url(#darkLogoGold)" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="45" cy="74" r="2.2" fill="url(#darkLogoGold)"/>
  </g>

  <!-- Typography Group (Dark Mode Optimized) -->
  <g transform="translate(125, 0)">
    <!-- Brand Name (ROYAL ENTERPRISE) in Warm Ivory & Amber Gold -->
    <text x="0" y="52"
      font-family="'Lora', Georgia, 'Times New Roman', serif"
      font-size="32"
      font-weight="700"
      letter-spacing="1.5"
      fill="#FAF7F2">
      ROYAL <tspan fill="#F59E0B">ENTERPRISE</tspan>
    </text>

    <!-- Decorative Hairline & Diamond Divider -->
    <line x1="0" y1="67" x2="160" y2="67" stroke="#38312B" stroke-width="1"/>
    <polygon points="170,67 174,63 178,67 174,71" fill="url(#darkLogoGold)"/>
    <line x1="188" y1="67" x2="390" y2="67" stroke="#38312B" stroke-width="1"/>

    <!-- Tagline (EVENTS • CATERING • WEDDINGS) -->
    <text x="0" y="85"
      font-family="'Hind Siliguri', 'Segoe UI', system-ui, sans-serif"
      font-size="12"
      font-weight="600"
      letter-spacing="3.8"
      fill="#FCD34D">
      EVENTS • CATERING • WEDDINGS
    </text>

    <!-- Kolkata Heritage Stamp -->
    <text x="0" y="103"
      font-family="'Hind Siliguri', 'Segoe UI', system-ui, sans-serif"
      font-size="10"
      font-weight="500"
      letter-spacing="2"
      fill="#A89F91">
      KOLKATA • EST. 2014
    </text>
  </g>
</svg>
