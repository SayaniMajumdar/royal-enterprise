  <!-- Base Laurel -->
  <path d="M 140 360 C 140 410 180 436 256 436 C 332 436 372 410 372 360" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="256" cy="436" r="10" fill="url(#goldGrad)"/>
