    <circle cx="256" cy="106" r="8" fill="url(#goldGrad)"/>
    <path d="M 210 174 L 216 128 L 230 173 Z" fill="url(#goldGrad)"/>
    <circle cx="216" cy="123" r="6" fill="url(#goldGrad)"/>
    <path d="M 302 174 L 296 128 L 282 173 Z" fill="url(#goldGrad)"/>
    <circle cx="296" cy="123" r="6" fill="url(#goldGrad)"/>
    <path d="M 180 174 L 176 142 L 196 174 Z" fill="url(#goldGrad)"/>
    <circle cx="176" cy="138" r="5" fill="url(#goldGrad)"/>
    <path d="M 332 174 L 336 142 L 316 174 Z" fill="url(#goldGrad)"/>
    <circle cx="336" cy="138" r="5" fill="url(#goldGrad)"/>
  </g>

  <!-- Monogram R -->
  <path d="M 204 220 L 204 366" fill="none" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="square"/>
  <path d="M 184 220 L 228 220" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 182 366 L 232 366" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round"/>
  <path d="M 204 220 L 262 220 C 296 220 318 238 318 266 C 318 294 294 310 260 310 L 204 310"
