  <path d="M 252 308 Q 272 328 322 368"
    fill="none" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="round"/>
  <circle cx="324" cy="368" r="9" fill="url(#goldGrad)"/>

  <!-- E flourish -->
  <path d="M 308 274 Q 346 274 346 312 Q 346 360 288 360 L 232 360"
    fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  <path d="M 276 314 L 332 314"
