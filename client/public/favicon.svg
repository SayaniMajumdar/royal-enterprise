      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1E32"/>
      <stop offset="50%" stop-color="#6E1423"/>
      <stop offset="100%" stop-color="#4A0A15"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#maroonGrad)"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Crown -->
